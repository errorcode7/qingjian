name: package-deb

# 发行版包（deb）构建。release.yml 发版时按 workflow_call 调用，也能在 Actions 页手动触发；
# 手动触发只出产物与验收结果，不碰 Release，改打包脚本时不用发标签就能验一遍。
# 两个 job：build 在容器里构建并做静态验收（apps/linux/tests/deb.py），install-test 再开一个**干净的**
# 同发行版容器把 deb 真装一遍（apt 自己解依赖、postinst 写没写输入法列表、ldd 齐不齐、卸载干不干净），
# 装不上就别想发出去。
# 必须在目标发行版自己的容器里构建：Fcitx5 插件链接的是构建机的 Fcitx5，跨发行版不通用，
# dpkg-shlibdeps 会顺手把这份绑定写成 Depends；构建最低 API 是 5.1.8，Ubuntu 24.04 自带的
# 5.1.7 不满足，所以不在列表里。
# 列表里第一项（第一个发行版 × 第一个架构）顺带产出 qingjian-data（与体系结构无关，各发行版内容相同，挂一份就够）。
# 默认只出人工验证过的 Ubuntu 26.04：debian-13 / debian-sid 的容器构建是通的，但装到真机还没人验过。
# 要挂到 Release 上，先手动触发本 workflow 构建出来、在真机上装过，再加进 release.yml 的列表。
#
# 矩阵是「发行版 × 架构」两维。架构不做交叉编译：bin/ 下的二进制就是构建机自己编的，插件又绑着构建机的
# Fcitx5，所以每个架构用自己的宿主 runner（x64 用 ubuntu-26.04，arm64 用 ubuntu-26.04-arm），容器仍是
# 目标发行版的官方镜像——Docker Hub 上的 ubuntu:26.04 是多架构 manifest，arm 宿主会拉到 arm64 变体。
# 架构默认 amd64,arm64，两种触发方式一致：arm64 的包在干净的 26.04 容器里真装真卸过（含 dpkg -V），
# 发版也随 Ubuntu 26.04 一起出。只要 x86 就在 archs 里写 amd64。
on:
  workflow_call:
    inputs:
      distros:
        type: string
        default: ubuntu-26.04
      archs:
        type: string
        default: amd64,arm64
      ref:
        description: 要构建的提交（发版时由 release.yml 传标签名）；不填就用触发本次运行的那个引用
        type: string
        default: ''
      sample:
        description: 只带样例词库（发版时不要开）
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      distros:
        description: 要构建的发行版，逗号分隔（已验证 ubuntu-26.04；待验证 debian-13 / debian-sid）
        type: string
        default: ubuntu-26.04
      archs:
        description: 要构建的架构，逗号分隔（amd64 / arm64；arm64 编得出来，但还没在真机上装过）
        type: string
        default: amd64,arm64
      sample:
        description: 只带样例词库，不下载 90 MB 产品数据
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      carrier: ${{ steps.matrix.outputs.carrier }}
      carrier_arch: ${{ steps.matrix.outputs.carrier_arch }}
    steps:
      - id: matrix
        env:
          DISTROS: ${{ inputs.distros }}
          ARCHS: ${{ inputs.archs }}
        run: |
          include='[]'
          carrier=''
          carrier_arch=''
          for distro in ${DISTROS//,/ }; do
            case "$distro" in
              ubuntu-26.04) image=ubuntu:26.04 ;;
              debian-13) image=debian:13 ;;
              debian-sid) image=debian:sid ;;
              *) echo "不支持的发行版：$distro" >&2; exit 1 ;;
            esac
            for arch in ${ARCHS//,/ }; do
              # 不交叉编译：宿主架构必须就是目标架构，容器再由这个宿主的 docker 拉目标发行版。
              case "$arch" in
                amd64) runner=ubuntu-26.04 ;;
                arm64) runner=ubuntu-26.04-arm ;;
                *) echo "不支持的架构：$arch（只支持 amd64 / arm64）" >&2; exit 1 ;;
              esac
              include=$(jq -c --arg distro "$distro" --arg image "$image" --arg arch "$arch" --arg runner "$runner" \
                '. + [{distro: $distro, image: $image, arch: $arch, runner: $runner}]' <<< "$include")
              # 数据包与架构、发行版都无关，只让矩阵第一项产出，避免几份同名 deb 互相覆盖。
              if [[ -z "$carrier" ]]; then carrier=$distro; carrier_arch=$arch; fi
            done
          done
          [[ -n "$carrier" ]] || { echo '发行版与架构都要给，否则矩阵是空的' >&2; exit 1; }
          echo "value={\"include\":$include}" >> "$GITHUB_OUTPUT"
          echo "carrier=$carrier" >> "$GITHUB_OUTPUT"
          echo "carrier_arch=$carrier_arch" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    # runs-on 决定宿主（架构由它决定，不交叉编译），container 决定 job 在哪个容器里跑，两者都要给（缺 runs-on 整个文件不合法）。
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # 容器里没有 sudo（本来就是 root），而且要先装 git 才 checkout 得动。
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 60
    # 容器 job 的默认 shell 是 sh（宿主上才是 bash），内联的 run 块里有 [[ ]]，得显式钉住。
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git and apt prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git xz-utils zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 发版时由 release.yml 指定标签，保证包来自被标记的那个提交；手动触发时不填，检出发起时的引用
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # 工作区目录是宿主 runner 建的（属主不是容器里的 root），git 会以 dubious ownership 拒绝读仓库；
      # 开发版号要读提交号，不声明 safe.directory 就直接 exit 128。
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.96.0

      # 缓存按发行版与架构分开：几个发行版共用一份 target/ 会拿到别的 libc 与别的 Fcitx5 编出来的产物，
      # amd64 与 arm64 的目标文件更是完全不能混。
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.distro }}-${{ matrix.arch }}

      - name: Install build and packaging dependencies
        run: |
          apt-get install -y --no-install-recommends \
            dpkg-dev python3 cmake g++ pkg-config libssl-dev nlohmann-json3-dev \
            libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev fcitx5

      - name: Fetch product data
        if: ${{ !inputs.sample }}
        run: |
          tools/release/data-fetch.sh
          ls -la data/generated data/models/hanzhang-zhiwei data/models/hanzhang-tongbian

      # --arch 是自检不是交叉编译：宿主架构若与矩阵不符（arm64 的 runner 没排上、退回 x64），
      # 这里立刻失败，而不是安静地打出一个标着 arm64 的 x64 包。
      - name: Build deb
        run: apps/linux/scripts/package-deb.sh --distro ${{ matrix.distro }} --arch ${{ matrix.arch }} ${{ inputs.sample && '--sample' || '' }}

      - name: Verify deb
        run: python3 apps/linux/tests/deb.py target/deb/out ${{ inputs.sample && '--sample' || '' }}

      - name: Record build machine
        run: |
          . /etc/os-release
          printf '%s %s, Fcitx5 %s\n' "$PRETTY_NAME" "$(dpkg --print-architecture)" "$(pkg-config --modversion Fcitx5Core)" > target/deb/out/build-machine.txt
          cat target/deb/out/build-machine.txt
          # 数据包与架构、发行版都无关：整张矩阵只让第一项产出，不然同名 deb 会撞在一起。
          if [[ "${{ matrix.distro }}" == "${{ needs.plan.outputs.carrier }}" ]] && [[ "${{ matrix.arch }}" == "${{ needs.plan.outputs.carrier_arch }}" ]]; then
            touch target/deb/out/ships-data
          fi

      # 产物名必须带架构：矩阵里 amd64 与 arm64 是两条腿，同名 artifact 会互相覆盖。
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.distro }}-${{ matrix.arch }}
          path: target/deb/out/
          if-no-files-found: error

  # 换一个干净容器把 deb 真装一遍。这里故意不装任何编译依赖：只有让 apt 自己去拉 fcitx5，
  # 「Depends 写对了没有」才有意义——build 那个容器里 fcitx5 与 -dev 包早就装上了。
  install-test:
    needs: [plan, build]
    # 与 build 同架构的宿主：deb 里是那个架构的二进制，装到别的架构上连 apt 都不会开始。
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 30
    # 同上：容器 job 的默认 shell 是 sh。
    defaults:
      run:
        shell: bash
    steps:
      - name: Install apt prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: deb-${{ matrix.distro }}-${{ matrix.arch }}
          path: target/deb/out

      - name: Install and verify
        run: apps/linux/tests/deb-install.sh target/deb/out ${{ inputs.sample && '--sample' || '' }}
